<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="small-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00b4d8" stroke-width="0.5" opacity="0.32"/>
    </pattern>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#small-grid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.42"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.17"/>
      <stop offset="55%" stop-color="#1b263b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0d1b2a"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g opacity="0.14" transform="translate(960 540)">
    <circle cx="0" cy="0" r="260" fill="none" stroke="#e0fbfc" stroke-width="2"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00b4d8" stroke-width="1.4"/>
    <path d="M0 -310 L28 -28 L310 0 L28 28 L0 310 L-28 28 L-310 0 L-28 -28 Z" fill="none" stroke="#e0fbfc" stroke-width="2"/>
    <path d="M0 -220 L22 -22 L220 0 L22 22 L0 220 L-22 22 L-220 0 L-22 -22 Z" fill="#00b4d8" opacity="0.24"/>
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#e0fbfc" stroke-width="1"/>
    <line x1="0" y1="-360" x2="0" y2="360" stroke="#e0fbfc" stroke-width="1"/>
  </g>

  <text x="960" y="545" text-anchor="middle"
        font-family="Monospace, 'Liberation Mono', monospace"
        font-size="148" font-weight="700"
        fill="#e0fbfc" opacity="0.92">ALEXOS</text>
  <text x="960" y="612" text-anchor="middle"
        font-family="Cantarell, sans-serif"
        font-size="28"
        fill="#00b4d8" opacity="0.84">ARCHITECT WORKSTATION LIVE SYSTEM</text>
</svg>
