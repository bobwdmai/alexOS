---
dontChroot: false
timeout: 30
script:
  - |
    set -e
    install -d -m 0755 /var/lib/alexos
    touch /var/lib/alexos/setup-complete
    rm -f /etc/sudoers.d/alexos-live
    rm -f /etc/xdg/autostart/alexos-setup-wizard.desktop
    rm -f /etc/systemd/system/graphical.target.wants/alexos-first-boot.service
    rm -f /etc/systemd/system/multi-user.target.wants/alexos-first-boot.service
    if command -v systemctl >/dev/null 2>&1; then
      systemctl disable alexos-first-boot.service >/dev/null 2>&1 || true
      systemctl enable NetworkManager.service >/dev/null 2>&1 || true
      systemctl enable alexos-update.timer >/dev/null 2>&1 || true
      systemctl set-default graphical.target >/dev/null 2>&1 || true
    fi
    for path in /etc/gdm3/custom.conf /etc/gdm3/daemon.conf; do
      install -d -m 0755 "$(dirname "${path}")"
      cat > "${path}" <<'GDMEOF'
    [daemon]
    WaylandEnable = false
    AutomaticLoginEnable = false
    TimedLoginEnable = false
    GDMEOF
    done
    if id alex >/dev/null 2>&1; then
      passwd -l alex >/dev/null 2>&1 || true
      usermod -s /usr/sbin/nologin alex >/dev/null 2>&1 || true
      gpasswd -d alex sudo >/dev/null 2>&1 || true
    fi
i18n:
  name: "Preparing AlexOS for first boot"
